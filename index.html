<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Universe for Anna ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>A Universe for Anna</h1>

        <p class="subtitle">365 stars. 365 little pieces of me.</p>

        <p class="description">
            A little universe I made just for you.
        </p>

        <p id="counter">365 stars waiting to be discovered ✨</p>

        <div id="star-field"></div>

        <div id="message-box" class="hidden">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <button id="close-message">Close ✨</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
